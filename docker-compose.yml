services:
  reverse-proxy:
    image: traefik
    command:
      - "--api=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/traefik-dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${DEFAULT_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8086:8080"
    volumes:
      - ./letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik-files/traefik-dynamic.yml:/traefik-dynamic.yml:ro
    networks:
      - app_network

  kanidm:
    image: kanidm/server:latest
    container_name: kanidm
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    volumes:
      - ./kanidm_data:/data
    environment:
      - TZ=America/Los_Angeles
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kanidm.rule=Host(`idm.lifeofpablo.com`)"
      - "traefik.http.routers.kanidm.entrypoints=websecure"
      - "traefik.http.routers.kanidm.tls.certresolver=myresolver"
      - "traefik.http.routers.kanidm.middlewares=kanidm-headers"
      - "traefik.http.middlewares.kanidm-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.kanidm-headers.headers.customrequestheaders.X-Forwarded-Host=idm.lifeofpablo.com"
      - "traefik.http.services.kanidm.loadbalancer.server.port=8443"
      - "traefik.http.services.kanidm.loadbalancer.server.scheme=https"
      - "traefik.http.services.kanidm.loadbalancer.serversTransport=kanidm-transport@file"
    networks:
      - app_network

  mariadb:
    image: mariadb:11
    container_name: mariadb
    ports:
      - "3306:3306"
    command: --max-allowed-packet=64MB
    restart: always
    volumes:
      - mariadb:/var/lib/mysql:Z
      - ./db-commands/custom.cnf:/etc/mysql/conf.d/custom.cnf
    environment:
      - MYSQL_ROOT_PASSWORD
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DISABLE_UPGRADE_BACKUP=1
      - TZ=America/Los_Angeles
    networks:
      - app_network

  miniflux:
    image: miniflux/miniflux:2.3.3
    container_name: miniflux
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://miniflux:${FRESHRSS_MYSQL_PASSWORD}@postgres/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - BASE_URL=https://reader.lifeofpablo.com
      - ROOT_URL=https://reader.lifeofpablo.com
      - OAUTH2_PROVIDER=${MINIFLUX_OAUTH2_PROVIDER}
      - OAUTH2_CLIENT_ID=${MINIFLUX_OAUTH2_CLIENT_ID}
      - OAUTH2_CLIENT_SECRET=${MINIFLUX_OAUTH2_CLIENT_SECRET}
      - OAUTH2_REDIRECT_URL=${MINIFLUX_OAUTH2_REDIRECT_URL}
      - OAUTH2_OIDC_DISCOVERY_ENDPOINT=${MINIFLUX_OAUTH2_OIDC_DISCOVERY_ENDPOINT}
      - OAUTH2_USER_CREATION=${MINIFLUX_OAUTH2_USER_CREATION}
      - OAUTH2_OIDC_PROVIDER_NAME="Kanidm"
      - DISABLE_LOCAL_AUTH=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.miniflux.rule=Host(`reader.lifeofpablo.com`)"
      - "traefik.http.routers.miniflux.entrypoints=websecure"
      - "traefik.http.routers.miniflux.tls.certresolver=myresolver"
      - "traefik.http.middlewares.miniflux.forwardauth.address=https://auth.lifeofpablo.com/auth"
      - "traefik.http.middlewares.miniflux.forwardauth.trustForwardHeader=true"
    networks:
      - app_network

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_USER=miniflux
      - POSTGRES_PASSWORD=${FRESHRSS_MYSQL_PASSWORD}
      - POSTGRES_DB=miniflux
    volumes:
      - miniflux-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s
    networks:
      - app_network

  vouch-proxy:
    container_name: vp-lifeofpablo
    image: quay.io/vouch/vouch-proxy:alpine-master
    ports:
      - "9090:9090"
    restart: always
    environment:
      - VOUCH_DOMAINS
      - OAUTH_PROVIDER=${VOUCH_OAUTH_PROVIDER}
      - OAUTH_CLIENT_ID=${VOUCH_OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${VOUCH_OAUTH_CLIENT_SECRET}
      - OAUTH_CALLBACK_URL=${VOUCH_OAUTH_CALLBACK_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vouch-proxy.rule=Host(`auth.lifeofpablo.com`)"
      - "traefik.http.routers.vouch-proxy.entrypoints=websecure"
      - "traefik.http.routers.vouch-proxy.tls.certresolver=myresolver"
    networks:
      - app_network

  korea:
    container_name: korea
    restart: always
    build:
      dockerfile: ./korea.lifeofpablo.com/Dockerfile  
    volumes:
      - ./korea.lifeofpablo.com/www:/var/www/html
    ports:
      - "8092:80"
    environment:
      - VIRTUAL_HOST=korea.lifeofpablo.com
      - LETSENCRYPT_HOST=korea.lifeofpablo.com
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.korea.rule=Host(`korea.lifeofpablo.com`)"
      - "traefik.http.routers.korea.entrypoints=websecure"
      - "traefik.http.routers.korea.tls.certresolver=myresolver"
    networks:
      - app_network

  lifeofpablo-app:
    build:
      dockerfile: ./lifeofpablo/Dockerfile 
    container_name: lifeofpablo-app
    restart: always
    ports:
      - "8110:80"
    volumes:
      - ./lifeofpablo.com/www:/var/www/main
      - ./lifeofpablo-interactives/www:/var/www/interactives
      - ./lifeofpablo-guestbook/www/guestbook:/var/www/guestbook
      - ./lifeofpablo-linkinbio/www:/var/www/linkinbio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lifeofpablo-proxy.rule=Host(`lifeofpablo.com`)"
      - "traefik.http.routers.lifeofpablo-proxy.entrypoints=websecure"
      - "traefik.http.routers.lifeofpablo-proxy.tls.certresolver=myresolver"
    networks:
      - app_network

  wishlist:
    container_name: wishlist
    image: ghcr.io/cmintey/wishlist:v0.66.0
    ports:
      - "3280:3280"
    volumes:
      - ./wishlist/uploads:/usr/src/app/uploads
      - ./wishlist/data:/usr/src/app/data
    environment:
      ORIGIN: https://wishlist.lifeofpablo.com
      TOKEN_TIME: 72
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wishlist.rule=Host(`wishlist.lifeofpablo.com`)"
      - "traefik.http.routers.wishlist.entrypoints=websecure"
      - "traefik.http.routers.wishlist.tls.certresolver=myresolver"
    networks:
      - app_network

  lifeofpablo-s3-proxy:
    image: nginx:bookworm-perl
    container_name: lifeofpablo-s3-proxy
    ports:
      - "8120:80"
    volumes:
      - ./nginx-proxy/s3/combined-s3.conf:/etc/nginx/nginx.conf:ro
    environment:
      - VIRTUAL_HOST=static.lifeofpablo.com,photos.lifeofpablo.com
      - LETSENCRYPT_HOST=static.lifeofpablo.com,photos.lifeofpablo.com
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lifeofpablo-s3.rule=Host(`static.lifeofpablo.com`) || Host(`photos.lifeofpablo.com`)"
      - "traefik.http.routers.lifeofpablo-s3.entrypoints=websecure"
      - "traefik.http.routers.lifeofpablo-s3.tls.certresolver=myresolver"
    networks:
      - app_network

  lifeofpablo-nyc-climateweek:
    build:
      dockerfile: ./climateweeknyc.lifeofpablo.com/Dockerfile  
    container_name: lifeofpablo-nyc-climateweek
    ports:
      - "8122:80"
    volumes:
      - ./climateweeknyc.lifeofpablo.com/www:/var/www/html
    environment:
      - VIRTUAL_HOST=climateweeknyc.lifeofpablo.com
      - LETSENCRYPT_HOST=climateweeknyc.lifeofpablo.com
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lifeofpablo-nyc-climateweek.rule=Host(`climateweeknyc.lifeofpablo.com`)"
      - "traefik.http.routers.lifeofpablo-nyc-climateweek.entrypoints=websecure"
      - "traefik.http.routers.lifeofpablo-nyc-climateweek.tls.certresolver=myresolver"
    networks:
      - app_network

  lifeofpablo-test:
    container_name: lifeofpablo-test
    restart: always
    build:
      dockerfile: ./test.lifeofpablo.com/Dockerfile  
    volumes:
      - ./test.lifeofpablo.com/www:/var/www/html
    ports:
      - "8097:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lifeofpablo-test.rule=Host(`test.lifeofpablo.com`)"
      - "traefik.http.routers.lifeofpablo-test.entrypoints=websecure"
      - "traefik.http.routers.lifeofpablo-test.tls.certresolver=myresolver"
    networks:
      - app_network

  europe24:
    container_name: europe24
    restart: always 
    build:
      dockerfile: ./europe24/Dockerfile  
    volumes:
      - ./europe24/www/yellow-main:/var/www/html
    ports:
      - "8125:80"
    environment:
      - VIRTUAL_HOST=eu24.lifeofpablo.com
      - LETSENCRYPT_HOST=eu24.lifeofpablo.com
    networks:
      - app_network

  1k:
    container_name: 1k
    restart: always
    build:
      dockerfile: ./1k.lifeofpablo.com/Dockerfile  
    volumes:
      - ./1k.lifeofpablo.com/www:/var/www/html
    ports:
      - "8127:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.1k.rule=Host(`1k.lifeofpablo.com`)"
      - "traefik.http.routers.1k.entrypoints=websecure"
      - "traefik.http.routers.1k.tls.certresolver=myresolver"
    networks:
      - app_network

  yourls:
    image: yourls:1.10
    container_name: yourls
    restart: always
    ports:
      - "8201:80"
    environment:
      YOURLS_DB_HOST: mariadb
      YOURLS_DB_USER: ${YOURLS_DB_USER}
      YOURLS_DB_PASS: ${YOURLS_DB_PASS}
      YOURLS_SITE: https://pabs.lol
      YOURLS_USER: ${YOURLS_USER}
      YOURLS_PASS: ${YOURLS_PASS}
      VIRTUAL_HOST: pabs.lol
      LETSENCRYPT_HOST: pabs.lol
    volumes:
      - ./yourls/plugins:/var/www/html/user/plugins
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.yourls.rule=Host(`pabs.lol`)"
      - "traefik.http.routers.yourls.entrypoints=websecure"
      - "traefik.http.routers.yourls.tls.certresolver=myresolver"
    networks:
      - app_network

  selfauth:
    build:
      context: ./selfauth2
      dockerfile: ./docker/Dockerfile
    container_name: selfauth
    restart: unless-stopped
    ports:
      - "9289:80"
    environment:
      - SELFAUTH_APP_URL=https://indieauth.lifeofpablo.com/
      - SELFAUTH_USER_URL=https://lifeofpablo.com/
      - SELFAUTH_ADMIN_PASSWORD=${SELFAUTH_ADMIN_PASSWORD}
      - SELFAUTH_WEBMENTIONS_ENABLED=true
      - SELFAUTH_TRUST_PROXY=true
      - SELFAUTH_COOKIE_SECURE=true
      - SELFAUTH_SYSLOG_SUCCESS=false
      - SELFAUTH_SYSLOG_FAILURE=false
      - TZ=America/Los_Angeles
      - SELFAUTH_OIDC_ISSUER=${SELFAUTH_OIDC_ISSUER}
      - SELFAUTH_OIDC_CLIENT_ID=${SELFAUTH_OIDC_CLIENT_ID}
      - SELFAUTH_OIDC_CLIENT_SECRET=${SELFAUTH_OIDC_CLIENT_SECRET}
      - SELFAUTH_OIDC_SCOPES=${SELFAUTH_OIDC_SCOPES}
      - SELFAUTH_OIDC_ALLOWED_EMAILS=${SELFAUTH_OIDC_ALLOWED_EMAILS}
      - SELFAUTH_LOGIN_OIDC_ENABLED=true
      - SELFAUTH_LOGIN_AUTH_MODE=both
      - SELFAUTH_ADMIN_OIDC_ENABLED=true
      - SELFAUTH_ADMIN_AUTH_MODE=both
    volumes:
      - selfauth_data2:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lifeofpablo-login.rule=Host(`indieauth.lifeofpablo.com`)"
      - "traefik.http.routers.lifeofpablo-login.entrypoints=websecure"
      - "traefik.http.routers.lifeofpablo-login.tls.certresolver=myresolver"
      - "traefik.http.services.lifeofpablo-login.loadbalancer.server.port=80"
    networks:
      - app_network

  pabs-api:
    container_name: pabs-api
    build:
      context: ./pabs-api
    environment:
      - NODE_ENV=production
      - API_DB_HOST
      - API_DB_USER
      - API_DB_PASS
      - API_DB
      - VIRTUAL_HOST=api.lifeofpablo.com
      - LETSENCRYPT_HOST=api.lifeofpablo.com
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pabs-api.rule=Host(`api.lifeofpablo.com`)"
      - "traefik.http.routers.pabs-api.entrypoints=websecure"
      - "traefik.http.routers.pabs-api.tls.certresolver=myresolver"
    ports:
      - "3453:3000"
    networks:
      - app_network

  media-api:
    build: ./media-api/app
    container_name: media-api
    restart: always
    ports:
      - "3460:3000"
    environment:
      - NODE_ENV=production
      - API_DB_HOST2
      - API_DB_USER2
      - API_DB_PASS2
      - API_DB2
      - API_JWT_SECRET
      - VIRTUAL_HOST=media-api.lifeofpablo.com
      - LETSENCRYPT_HOST=media-api.lifeofpablo.com
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.media-api.rule=Host(`media-api.lifeofpablo.com`)"
      - "traefik.http.routers.media-api.entrypoints=websecure"
      - "traefik.http.routers.media-api.tls.certresolver=myresolver"
    networks:
      - app_network

  11ty:
    container_name: 11ty
    build:
      context: ./11vty/eleventy-from-scratch
    environment:
      - NODE_ENV=production
      - VIRTUAL_HOST=beta.lifeofpablo.com
      - LETSENCRYPT_HOST=beta.lifeofpablo.com
    ports:
      - "3455:8080"
    networks:
      - app_network

  lifeofpablo-11ty-proxy:
    container_name: lifeofpablo-11ty-proxy
    image: nginx:bookworm
    ports: 
      - "3456:80"
    volumes:
      - ./nginx-proxy/lifeofpablo-11ty:/etc/nginx/conf.d
    depends_on:
      - 11ty 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.11vty.rule=Host(`beta.lifeofpablo.com`)"
      - "traefik.http.routers.11vty.entrypoints=websecure"
      - "traefik.http.routers.11vty.tls.certresolver=myresolver"
    networks:
      - app_network

  it-tools:
    image: 'corentinth/it-tools:latest'
    ports:
      - '8234:80'
    restart: unless-stopped
    container_name: it-tools
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.it-tools.rule=Host(`it-tools.lifeofpablo.com`)"
      - "traefik.http.routers.it-tools.entrypoints=websecure"
      - "traefik.http.routers.it-tools.tls.certresolver=myresolver"
    networks:
      - app_network

volumes:
  mariadb:
  miniflux-db:
  postgres_data:
    driver: local
  db_storage:
  n8n_storage:
  selfauth_data2:

networks:
  app_network:
    driver: bridge