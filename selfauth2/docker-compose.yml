services:
  selfauth:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Or, once published: image: ghcr.io/yourname/selfauth:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # ---- Required ----
      SELFAUTH_APP_URL: "https://example.com/auth/"
      SELFAUTH_USER_URL: "https://example.com/"
      # Only read on first boot, then hashed and stored in the database.
      # Remove it from your environment after the first successful start,
      # or change the password from the admin portal at /admin/.
      SELFAUTH_ADMIN_PASSWORD: "change-me-before-first-boot"

      # ---- Core options ----
      # SELFAUTH_APP_KEY: ""                # auto-generated & persisted if omitted
      SELFAUTH_WEBMENTIONS_ENABLED: "true"
      SELFAUTH_TRUST_PROXY: "false"          # set true if behind a reverse proxy
      SELFAUTH_COOKIE_SECURE: "true"         # requires HTTPS; set false for local http testing
      SELFAUTH_SYSLOG_SUCCESS: "false"
      SELFAUTH_SYSLOG_FAILURE: "false"
      TZ: "UTC"

      # ---- OIDC/OAuth2 (e.g. Kanidm) ----
      # Shared connection settings. Uncomment and fill in to enable either
      # (or both) of the two independent toggles below.
      # SELFAUTH_OIDC_ISSUER: "https://idm.example.com/oauth2/openid/selfauth"
      # SELFAUTH_OIDC_CLIENT_ID: "selfauth"
      # SELFAUTH_OIDC_CLIENT_SECRET: ""              # omit/blank for a public PKCE client
      # SELFAUTH_OIDC_SCOPES: "openid profile email"
      # SELFAUTH_OIDC_REDIRECT_URI: ""               # defaults to {APP_URL}/oidc-callback.php
      # Owner allow-list -- required for EITHER toggle below to activate.
      # SELFAUTH_OIDC_ALLOWED_EMAILS: "me@example.com"
      # SELFAUTH_OIDC_ALLOWED_SUBJECTS: ""

      # Toggle 1: sign into the IndieAuth "me" endpoint itself via SSO --
      # other websites will see you authenticate this way. Owner allow-list
      # only; delegates (below) can never use this.
      # SELFAUTH_LOGIN_OIDC_ENABLED: "true"
      # SELFAUTH_REQUIRE_PKCE: "true"                # reject requests without PKCE (recommended)
      # SELFAUTH_ALLOWED_SCOPES: "profile email"     # permissions Selfauth may grant
      # SELFAUTH_LOGIN_AUTH_MODE: "both"             # password | oidc | both

      # Toggle 2: sign into the /admin/ portal via SSO. Owner allow-list
      # grants full access; identities added on the Admins page (in the
      # admin portal itself) get delegated "manager" or "viewer" access.
      # SELFAUTH_ADMIN_OIDC_ENABLED: "true"
      # SELFAUTH_ADMIN_AUTH_MODE: "both"             # password | oidc | both

      # ---- Micropub (posts become commits in a GitHub repository) ----
      # SELFAUTH_MICROPUB_ENABLED: "true"
      # SELFAUTH_MICROPUB_GITHUB_TOKEN: ""           # fine-grained PAT: Contents read/write on one repo
      # SELFAUTH_MICROPUB_GITHUB_REPO: "me/site"
      # SELFAUTH_MICROPUB_GITHUB_BRANCH: "main"
      # SELFAUTH_MICROPUB_CONTENT_PATH: "content"
      # SELFAUTH_MICROPUB_BLOG_DIR: "blog"
      # SELFAUTH_MICROPUB_LANGUAGE: ""               # adds a Language key to new posts
      # Media goes to Backblaze B2. All four are needed, and posts work without them.
      # SELFAUTH_MICROPUB_B2_KEY_ID: ""              # application key limited to one bucket, writeFiles
      # SELFAUTH_MICROPUB_B2_APP_KEY: ""
      # SELFAUTH_MICROPUB_B2_BUCKET_ID: ""
      # SELFAUTH_MICROPUB_MEDIA_URL: "https://cdn.example.com"
      # SELFAUTH_MICROPUB_MEDIA_PREFIX: "media/micropub"
      # SELFAUTH_MICROPUB_AUTHOR: ""
      # SELFAUTH_TOKEN_TTL: "7776000"                # access token lifetime in seconds (90 days)
      
      # ---- Webmention feed ----
      # SELFAUTH_WEBMENTION_FEED_PUBLIC: "false"     # default: private, token in /admin/settings.php

      # ---- Outgoing email notifications ----
      # No SMTP host set = notifications disabled.
      # SELFAUTH_SMTP_HOST: "smtp.example.com"
      # SELFAUTH_SMTP_PORT: "587"
      # SELFAUTH_SMTP_USER: ""
      # SELFAUTH_SMTP_PASS: ""
      # SELFAUTH_SMTP_ENCRYPTION: "tls"              # tls | ssl | none
      # SELFAUTH_SMTP_FROM: "selfauth@example.com"
      # SELFAUTH_NOTIFY_EMAIL: "me@example.com"
      # SELFAUTH_NOTIFY_EVENTS: "signin.failed,signin.blocked"
    volumes:
      - selfauth_data:/app/data

volumes:
  selfauth_data:
